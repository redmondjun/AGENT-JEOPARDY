name: Codex CI Repair

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  eligibility:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.actor.type != 'Bot' &&
      github.event.workflow_run.pull_requests[0] != null
    runs-on: ubuntu-latest
    outputs:
      eligible: ${{ steps.gate.outputs.eligible }}
      head_branch: ${{ steps.gate.outputs.head_branch }}
      head_sha: ${{ steps.gate.outputs.head_sha }}
      pr_number: ${{ steps.gate.outputs.pr_number }}
    steps:
      - name: Verify trusted same-repository pull request
        id: gate
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const run = context.payload.workflow_run;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const candidates = run.pull_requests || [];

            core.setOutput("eligible", "false");
            if (candidates.length !== 1) {
              core.info(`Expected one pull request, found ${candidates.length}.`);
              return;
            }

            const prNumber = candidates[0].number;
            const { data: pr } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: prNumber,
            });

            if (pr.state !== "open") {
              core.info(`PR #${prNumber} is not open.`);
              return;
            }
            if (!pr.head.repo || pr.head.repo.full_name !== `${owner}/${repo}`) {
              core.info(`PR #${prNumber} comes from a fork; refusing repair.`);
              return;
            }
            if (pr.head.sha !== run.head_sha) {
              core.info(`PR #${prNumber} advanced after run ${run.id}; refusing stale repair.`);
              return;
            }

            const { data: access } =
              await github.rest.repos.getCollaboratorPermissionLevel({
                owner,
                repo,
                username: run.actor.login,
              });
            const trusted = new Set(["admin", "maintain", "write"]);
            if (!trusted.has(access.permission)) {
              core.info(`${run.actor.login} does not have write access.`);
              return;
            }

            core.setOutput("eligible", "true");
            core.setOutput("head_branch", pr.head.ref);
            core.setOutput("head_sha", pr.head.sha);
            core.setOutput("pr_number", String(pr.number));

  repair:
    needs: eligibility
    if: needs.eligibility.outputs.eligible == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: codex-ci-repair-pr-${{ needs.eligibility.outputs.pr_number }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      status: ${{ steps.validate.outputs.status }}
      verified: ${{ steps.validate.outputs.verified }}
    env:
      FAILED_RUN_ID: ${{ github.event.workflow_run.id }}
      HEAD_SHA: ${{ needs.eligibility.outputs.head_sha }}
    steps:
      - name: Check out failing revision
        uses: actions/checkout@v5
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Collect failed logs and trusted prompt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run view "$FAILED_RUN_ID" --log-failed > .codex-ci-failure.log
          git fetch --no-tags origin main
          git show origin/main:.github/codex/prompts/fix-ci.md \
            > .codex-repair-prompt.md

      - name: Run Codex repair
        id: codex
        continue-on-error: true
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .codex-repair-prompt.md
          output-file: .codex-repair-summary.md
          sandbox: workspace-write
          safety-strategy: drop-sudo

      - name: Validate proposed repair
        id: validate
        if: always()
        env:
          CODEX_OUTCOME: ${{ steps.codex.outcome }}
        run: |
          set -uo pipefail
          report_dir="$RUNNER_TEMP/codex-repair"
          mkdir -p "$report_dir"

          if [[ -f .codex-repair-summary.md ]]; then
            cp .codex-repair-summary.md "$report_dir/summary.md"
          fi
          rm -f .codex-ci-failure.log .codex-repair-prompt.md \
            .codex-repair-summary.md

          echo "verified=false" >> "$GITHUB_OUTPUT"

          stop_repair() {
            echo "status=$1" >> "$GITHUB_OUTPUT"
            printf '%s\n' "$1" > "$report_dir/status.txt"
            exit 0
          }

          if [[ "$CODEX_OUTCOME" != "success" ]]; then
            stop_repair "Codex did not complete successfully; no changes were pushed."
          fi

          if [[ -n "$(git status --porcelain -- .github)" ]]; then
            stop_repair "Codex changed protected .github files; no changes were pushed."
          fi

          if [[ -z "$(git status --porcelain --untracked-files=all)" ]]; then
            stop_repair "Codex produced no code changes; no changes were pushed."
          fi

          set +e
          python -m compileall -q main.py jeopardy.py tools
          compile_status=$?
          python -m pytest tests -v
          test_status=$?
          bash scripts/build_agent.sh
          build_status=$?
          bash scripts/verify_zip.sh
          zip_status=$?
          set -e
          rm -f agent.zip

          if (( compile_status != 0 || test_status != 0 ||
                build_status != 0 || zip_status != 0 )); then
            stop_repair "Codex changes failed independent validation; no changes were pushed."
          fi

          # Include untracked files in a binary-safe patch without committing.
          git add -N -- .
          git diff --binary --full-index HEAD > "$report_dir/repair.patch"
          if [[ ! -s "$report_dir/repair.patch" ]]; then
            stop_repair "Codex produced no patch after validation; no changes were pushed."
          fi

          status="Codex produced a repair that passed all validation."
          printf '%s\n' "$status" > "$report_dir/status.txt"
          echo "verified=true" >> "$GITHUB_OUTPUT"
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Upload repair artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codex-repair-${{ github.run_id }}
          path: ${{ runner.temp }}/codex-repair/
          if-no-files-found: warn
          retention-days: 1

  publish:
    needs: [eligibility, repair]
    if: needs.repair.outputs.verified == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: write
      contents: write
      pull-requests: read
    outputs:
      commit_sha: ${{ steps.push.outputs.commit_sha }}
      status: ${{ steps.dispatch.outputs.status }}
    env:
      HEAD_BRANCH: ${{ needs.eligibility.outputs.head_branch }}
      HEAD_SHA: ${{ needs.eligibility.outputs.head_sha }}
      PR_NUMBER: ${{ needs.eligibility.outputs.pr_number }}
    steps:
      - name: Check out failing revision on a fresh runner
        uses: actions/checkout@v5
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download validated repair
        uses: actions/download-artifact@v4
        with:
          name: codex-repair-${{ github.run_id }}
          path: ${{ runner.temp }}/codex-repair/

      - name: Apply repair patch
        run: |
          set -euo pipefail
          patch="$RUNNER_TEMP/codex-repair/repair.patch"
          if [[ ! -s "$patch" ]]; then
            echo "Validated repair patch is missing." >&2
            exit 1
          fi
          if git apply --numstat "$patch" |
              awk -F '\t' '$3 == ".github" || $3 ~ /^\\.github\\// { found=1 } END { exit !found }'
          then
            echo "Repair patch contains protected .github changes." >&2
            exit 1
          fi
          git apply --check --binary "$patch"
          git apply --index --binary "$patch"
          if [[ -n "$(git diff --cached --name-only -- .github)" ]]; then
            echo "Applied repair contains protected .github changes." >&2
            exit 1
          fi

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Revalidate repair on fresh runner
        run: |
          set -euo pipefail
          python -m compileall -q main.py jeopardy.py tools
          python -m pytest tests -v
          bash scripts/build_agent.sh
          bash scripts/verify_zip.sh
          rm -f agent.zip

      - name: Push verified repair
        id: push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          remote_sha="$(git ls-remote origin "refs/heads/$HEAD_BRANCH" | cut -f1)"
          if [[ "$remote_sha" != "$HEAD_SHA" ]]; then
            echo "PR branch advanced after repair started; refusing stale push." >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(ci): repair failing tests for PR #$PR_NUMBER"
          git remote set-url origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:refs/heads/$HEAD_BRANCH"
          commit_sha="$(git rev-parse HEAD)"
          echo "commit_sha=$commit_sha" >> "$GITHUB_OUTPUT"

      - name: Run CI for repaired revision
        id: dispatch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run ci.yml --ref "$HEAD_BRANCH"
          echo "status=Repair commit ${{ steps.push.outputs.commit_sha }} was pushed and CI was dispatched." \
            >> "$GITHUB_OUTPUT"

  report:
    needs: [eligibility, repair, publish]
    if: >-
      always() &&
      needs.eligibility.outputs.eligible == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - name: Download repair report
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: codex-repair-${{ github.run_id }}
          path: ${{ runner.temp }}/codex-repair/

      - name: Comment on pull request
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ needs.eligibility.outputs.pr_number }}
          PUBLISH_COMMIT: ${{ needs.publish.outputs.commit_sha }}
          PUBLISH_STATUS: ${{ needs.publish.outputs.status }}
          REPAIR_STATUS: ${{ needs.repair.outputs.status }}
          SUMMARY_PATH: ${{ runner.temp }}/codex-repair/summary.md
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require("fs");
            let summary = "";
            if (fs.existsSync(process.env.SUMMARY_PATH)) {
              summary = fs.readFileSync(process.env.SUMMARY_PATH, "utf8").trim();
              summary = summary.slice(0, 6000).replaceAll("@", "@\u200b");
            }

            const pushed = Boolean(process.env.PUBLISH_COMMIT);
            const heading = pushed
              ? "### Codex CI repair pushed"
              : "### Codex CI repair stopped";
            const status = process.env.PUBLISH_STATUS ||
              (pushed
                ? "The repair commit was pushed, but CI dispatch did not complete."
                : "") ||
              process.env.REPAIR_STATUS ||
              "The repair workflow did not complete; no changes were pushed.";
            const details = summary
              ? `\n\n<details><summary>Codex summary</summary>\n\n${summary}\n\n</details>`
              : "";

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.PR_NUMBER),
              body: `${heading}\n\n${status}${details}`,
            });
