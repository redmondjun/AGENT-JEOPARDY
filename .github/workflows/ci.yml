name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Repair commits pushed with GITHUB_TOKEN do not emit a pull_request event.
  # The repair workflow dispatches CI explicitly for the repaired revision.
  workflow_dispatch:

env:
  HOSTED_PYTHON_PACKAGES: anthropic httpx requests beautifulsoup4 lxml numpy pandas

jobs:
  test:
    runs-on: ubuntu-latest
    # Matches the hosted agent image (README "Your agent's environment").
    container: python:3.12-slim
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          # The event runner preinstalls these packages, but python:3.12-slim
          # does not. Install them explicitly so CI matches the hosted image.
          pip install --no-cache-dir $HOSTED_PYTHON_PACKAGES
          pip install --no-cache-dir -r requirements.txt -r requirements-dev.txt

      - name: Compile check (syntax gate for every module)
        run: python -m compileall -q main.py jeopardy.py tools

      - name: Run tests
        run: python -m pytest tests -v

  zip-build:
    runs-on: ubuntu-latest
    container: python:3.12-slim
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Install release tools
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends zip unzip
          rm -rf /var/lib/apt/lists/*
          pip install --no-cache-dir $HOSTED_PYTHON_PACKAGES

      - name: Build agent.zip
        run: bash scripts/build_agent.sh

      - name: Verify agent.zip
        run: bash scripts/verify_zip.sh
